<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>研面 - 面试练习系统（云端版）</title>
    <link rel="stylesheet" href="styles.css?v=20260930" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Supabase JS SDK (本地) -->
    <script src="supabase.min.js"></script>

    <!-- 应用脚本 -->
    <script src="supabase-config.js"></script>
    <script src="supabase-service.js"></script>
    <script src="domain-supabase.js"></script>
    <script src="views-supabase.js"></script>
    <script src="app-supabase-main.js"></script>

    <script>
      // 确保 DOM 加载完成后初始化
      document.addEventListener('DOMContentLoaded', async () => {
        console.log('[Supabase 版本] 开始初始化');

        // 检查依赖
        if (!window.supabase) {
          console.error('[加载错误] Supabase SDK 未正确加载');
          document.getElementById('app').innerHTML = `
            <div style="padding: 40px; text-align: center;">
              <h2>加载失败</h2>
              <p>Supabase SDK 加载失败，请检查网络连接后刷新页面。</p>
            </div>
          `;
          return;
        }

        if (!window.YanmianDomain) {
          console.error('[加载错误] Domain 层未正确加载');
          return;
        }

        if (!window.appSupabase) {
          console.error('[加载错误] App 层未正确加载');
          return;
        }

        // 初始化应用
        try {
          await window.appSupabase.init();
          console.log('[Supabase 版本] 初始化成功');
        } catch (error) {
          console.error('[初始化失败]', error);
          document.getElementById('app').innerHTML = `
            <div style="padding: 40px; text-align: center;">
              <h2>初始化失败</h2>
              <p>${error.message}</p>
              <button onclick="location.reload()">重新加载</button>
            </div>
          `;
        }
      });
    </script>
  </body>
</html>
